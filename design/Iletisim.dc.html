<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #fbbf24; text-decoration: none; }
    a:hover { color: #fcd34d; }
  </style>
</helmet>

<div style="width: 1440px; height: 680px; background: #0a0a0a; color: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">

  <div style="padding: 72px 48px 0 48px;">
    <div style="display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 80px; align-items: start;">

      <div style="display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; align-items: baseline; gap: 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.4);">
          <span style="color: #fbbf24;">04</span>
          <span style="width: 28px; height: 1px; background: rgba(255,255,255,0.25); display: inline-block; transform: translateY(-3px);"></span>
          <span>İletişim</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 24px;">
        <div style="font-size: 66px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.95;">Konuşalım</div>
        <div style="font-size: 16px; font-weight: 400; line-height: 1.7; color: rgba(255,255,255,0.55); max-width: 480px; text-wrap: pretty;">
          Yayıncılık, iş birliği ya da sadece oyunlarımız hakkında bir soru — yazın, okuyoruz.
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
          <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.015em; color: #fbbf24;">[E-POSTA ADRESİ]</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 20px; padding-top: 10px;">
        <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(255,255,255,0.35);">Bizi takip edin</div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;">
            <span style="font-size: 14px; font-weight: 600;">Google Play</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;">
            <span style="font-size: 14px; font-weight: 600;">LinkedIn</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;">
            <span style="font-size: 14px; font-weight: 600;">X / Twitter</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div style="border-top: 1px solid rgba(255,255,255,0.1); padding: 30px 48px; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 28px;">
      <div style="font-size: 18px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase;">Altare</div>
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: rgba(255,255,255,0.35);">© 2026 Altare · Tüm hakları saklıdır</div>
    </div>
    <div style="display: flex; gap: 28px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.45);">
      <span>Gizlilik Politikası</span>
      <span>Kullanım Şartları</span>
      <span style="color: rgba(255,255,255,0.28);">altarestudio.com.tr</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
