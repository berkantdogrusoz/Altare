<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #fbbf24; text-decoration: none; }
    a:hover { color: #fcd34d; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0a0a0a; color: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Üst çubuk -->
  <div style="padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;">
    <div style="font-size: 16px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase;">Altare</div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em;">
        <span>TR</span>
        <span style="width: 1px; height: 10px; background: rgba(255,255,255,0.2);"></span>
        <span style="color: rgba(255,255,255,0.35);">EN</span>
      </div>
      <!-- Menü: 44px hedef -->
      <div style="width: 44px; height: 44px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 5px;">
        <span style="width: 22px; height: 2px; background: #ffffff; display: block; border-radius: 2px;"></span>
        <span style="width: 15px; height: 2px; background: #ffffff; display: block; border-radius: 2px;"></span>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <div style="padding: 34px 20px 30px 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 26px; height: 1px; background: #fbbf24; display: inline-block;"></span>
      <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #fbbf24;">Mobil Oyun Stüdyosu</span>
    </div>
    <div style="font-size: 62px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.035em; line-height: 0.86;">Altare</div>
    <div style="font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; text-wrap: pretty;">
      Bırakamayacağın dünyalar kuruyoruz
    </div>
    <div style="display: flex; gap: 26px; margin-top: 4px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 22px; font-weight: 900; line-height: 1;">6</span>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.4);">Oyun</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 22px; font-weight: 900; line-height: 1;">50K+</span>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.4);">İndirme</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 22px; font-weight: 900; line-height: 1;">2025</span>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.4);">Kuruluş</span>
      </div>
    </div>
  </div>

  <!-- Flagship kartı -->
  <div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.45);">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fbbf24; display: inline-block;"></span>
      Şu an oynanıyor
    </div>

    <div style="border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.02);">
      <div style="position: relative;">
        <img src="chophero.jpg" alt="ChopHero: Relic Quest" style="width: 100%; height: 168px; object-fit: cover; display: block;">
        <div style="position: absolute; top: 12px; left: 12px; background: rgba(251,191,36,0.95); color: #0a0a0a; padding: 5px 11px; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;">Yeni</div>
      </div>
      <div style="padding: 16px 16px 18px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 19px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.15;">ChopHero: Relic Quest</div>
          <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.45);">Çevrimdışı · Action RPG</div>
        </div>
        <!-- 44px minimum hedef -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 9px; background: #fbbf24; color: #0a0a0a; height: 46px; border-radius: 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;">
          Google Play'de Oyna
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        </div>
      </div>
    </div>

    <!-- İki sütun: başlıklar görünür -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="border-radius: 10px; overflow: hidden; aspect-ratio: 16/10;">
          <img src="royaldreams.jpg" alt="Royal Dreams" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 12px; font-weight: 800;">Royal Dreams</div>
          <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4);">Puzzle</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="border-radius: 10px; overflow: hidden; aspect-ratio: 16/10;">
          <img src="coreofhunt.jpg" alt="Core of the Hunt" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 12px; font-weight: 800;">Core of the Hunt</div>
          <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4);">Action</div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
