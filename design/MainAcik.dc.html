<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #9a6700; text-decoration: none; }
    a:hover { color: #7c5200; }
  </style>
</helmet>

<!--
  AÇIK MOD — koyu moddan farkı yalnızca renk katmanı.
  Yerleşim, tipografi ve boşluklar birebir aynı.
    zemin    #0a0a0a          -> #faf8f5 (sıcak kırık beyaz)
    metin    #ffffff          -> #0a0a0a (aynı yakın-siyah, kimlik korunur)
    amber    DOLGU olarak     -> #fbbf24 aynen kalır (üstündeki metin koyu)
    amber    YAZI olarak      -> #9a6700 — #fbbf24 kırık beyaz üstünde okunmuyor
-->
<div style="width: 1440px; height: 900px; background: #faf8f5; color: #0a0a0a; position: relative; overflow: hidden;">

  <!-- Dikey ızgara çizgileri -->
  <div style="position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); padding: 0 48px;">
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045);"></div>
    <div style="border-left: 1px solid rgba(10,10,10,0.045); border-right: 1px solid rgba(10,10,10,0.045);"></div>
  </div>

  <!-- Navigasyon -->
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 26px 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(10,10,10,0.09);">
    <div style="display: flex; align-items: center; gap: 11px;">
      <svg width="21" height="33" viewBox="0 0 26 42" fill="none" style="display: block; flex-shrink: 0;" aria-label="Altare logo (yer tutucu)"><path d="M13 3C5 12 5 18 13 22c8 4 8 10 0 19" stroke="#0a0a0a" stroke-width="3.2" stroke-linecap="round"/></svg>
      <span style="font-size: 20px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase;">Altare</span>
    </div>
    <div style="display: flex; align-items: center; gap: 36px;">
      <div style="display: flex; gap: 32px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.6);">
        <span>Hakkımızda</span>
        <span>Oyunlar</span>
        <span style="color: #9a6700;">Discover</span>
        <span>İletişim</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em;">
        <span style="color: #0a0a0a;">TR</span>
        <span style="width: 1px; height: 12px; background: rgba(10,10,10,0.2);"></span>
        <span style="color: rgba(10,10,10,0.35);">EN</span>
      </div>
    </div>
  </div>

  <!-- İçerik -->
  <div style="position: absolute; top: 84px; left: 48px; right: 48px; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 0 52px 0;">

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; align-items: baseline; gap: 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(10,10,10,0.42);">
        <span style="color: #9a6700;">01</span>
        <span style="width: 28px; height: 1px; background: rgba(10,10,10,0.25); display: inline-block; transform: translateY(-3px);"></span>
        <span>Stüdyo</span>
      </div>
      <div style="display: flex; gap: 44px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="color: rgba(10,10,10,0.38);">Merkez</span>
          <span style="color: rgba(10,10,10,0.82);">İstanbul</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="color: rgba(10,10,10,0.38);">Kuruluş</span>
          <span style="color: rgba(10,10,10,0.82);">2025</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="color: rgba(10,10,10,0.38);">Portfolyo</span>
          <span style="color: rgba(10,10,10,0.82);">6 Oyun</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0;">
      <div style="font-size: 216px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.035em; line-height: 0.82; color: #0a0a0a;">Altare</div>
      <div style="display: flex; align-items: center; gap: 20px; margin-top: 26px;">
        <span style="width: 96px; height: 1px; background: rgba(10,10,10,0.3); display: inline-block;"></span>
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(10,10,10,0.55);">Mobil Oyun Stüdyosu</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 64px;">
      <div style="font-size: 42px; font-weight: 800; line-height: 1.12; letter-spacing: -0.015em; max-width: 560px; text-wrap: pretty;">
        Bırakamayacağın<br>dünyalar kuruyoruz
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px; align-items: flex-end;">
        <div style="display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(10,10,10,0.45);">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; display: inline-block;"></span>
          Şu an oynanıyor
        </div>
        <div style="display: flex; align-items: stretch; gap: 18px; border: 1px solid rgba(10,10,10,0.12); border-radius: 14px; padding: 14px; background: #ffffff;">
          <img src="chophero.jpg" alt="ChopHero: Relic Quest" style="width: 148px; height: 84px; object-fit: cover; border-radius: 8px; display: block;">
          <div style="display: flex; flex-direction: column; justify-content: center; gap: 7px; padding-right: 6px;">
            <div style="font-size: 17px; font-weight: 800; letter-spacing: 0.01em;">ChopHero: Relic Quest</div>
            <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.45);">Çevrimdışı · Action RPG</div>
            <div style="display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #9a6700; margin-top: 2px;">
              Google Play'de oyna
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9a6700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
